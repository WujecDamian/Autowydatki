name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autowydatki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The name must end with _test: the API tests refuse to run on any other database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/autowydatki_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/autowydatki_test
      DATABASE_SSL: "false"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # postinstall runs `prisma generate`, which needs DATABASE_URL (set above).
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run test:api

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/setup-node@v7
      - uses: actions/checkout@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:components
      - run: npm run build
